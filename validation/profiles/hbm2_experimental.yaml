# EXPERIMENTAL: one Ramulator HBM2 channel includes two pseudochannels.
# Experimental HBM2 geometry. Bambu 2.1 derives the DRAM tick rate
# from the selected timing preset; clock_ratio is the legacy value.
Frontend:
  impl: GEM5
MemorySystem:
  impl: GenericDRAM
  clock_ratio: 10
  DRAM:
    impl: HBM2
    org:
      preset: HBM2_4Gb
      channel: 1
    timing:
      preset: HBM2_2Gbps
  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
  AddrMapper:
    impl: RoBaRaCoCh
