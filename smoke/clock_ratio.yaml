# Ramulator2 configuration for the candidate-release AXI + Ramulator2 smoke test.
# DDR4-2400, single channel. With Bambu's Ramulator 2.1 driver, the test
# clock period and the DRAM preset tCK determine the effective ratio.
# The clock_ratio field retains the value used by the legacy fixture.
Frontend:
  impl: GEM5

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel: 1
      rank: 1
    timing:
      preset: DDR4_2400R

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
